<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Winter treasures lab</title>
<style>
  html, body { margin: 0; background: linear-gradient(180deg, #bfe0ff, #e4f1ff 40%, #fff1de); min-height: 100%; font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; color: #3d2c4e; }
  header { padding: 18px 24px 4px; }
  h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; color: #6b5a7d; }
  section { padding: 10px 24px 18px; }
  h2 { margin: 8px 0 10px; font-size: 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: rgba(255, 253, 248, 0.92); border-radius: 22px; padding: 10px 12px 12px; box-shadow: 0 6px 18px rgba(61, 44, 78, 0.12); display: flex; flex-direction: column; gap: 6px; }
  .card.pending { opacity: 0.55; }
  .card .big { width: 100%; height: 190px; border-radius: 16px; background: linear-gradient(180deg, #cfe6ff, #eef6ff); }
  .card .row { display: flex; align-items: center; gap: 10px; }
  .card .thumb { flex: none; background: #fff4e3; border-radius: 14px; }
  .card b { font-size: 17px; display: block; }
  .card small { color: #6b5a7d; font-size: 13px; line-height: 1.25; display: block; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #e2f8f0; color: #3fa487; }
  .card.pending .tag { background: #f4efe8; color: #8a7a6a; }
</style>
</head>
<body>
<header>
  <h1>❄️ Winter treasures</h1>
  <p>The new hats, extras, puffs and flowers. This page reloads by itself as each one is drawn. Big picture on top; the real wardrobe-size thumbnail below.</p>
</header>
<main id="root"></main>
<script type="module" src="./treasures.ts"></script>
</body>
</html>
