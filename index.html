<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Wordsprout · a typing garden</title>
    <meta name="description" content="Wordsprout: a whimsical typing game where every word you type grows a flower. Adapts to every skill level, from first keys to speed typing." />
    <meta name="theme-color" content="#8fc8ff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23ffd95e' stroke='%23c58a1f' stroke-width='3'/%3E%3Cpath d='M22 18c-4 10-4 22 0 32M36 13c-4 12-4 30 0 42' stroke='%238e5fa8' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='30' r='4' fill='%233d2c4e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="kb-layer"></div>
      <div id="ui"></div>
      <input id="type-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Type here" />
      <div id="sr-live" class="sr-only" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
